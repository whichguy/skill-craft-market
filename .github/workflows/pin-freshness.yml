name: pin-freshness

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check-pins:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market
    steps:
      - uses: actions/checkout@v4
        with:
          path: market
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: whichguy/skill-craft
          ref: main
          path: skill-craft
          persist-credentials: false
      - name: Verify changed release payloads
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_READ_TOKEN || github.token }}
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/check-release-payload.py --base "$RELEASE_BASE"
      - name: Validate catalog shape and current skill coverage
        run: |
          set -euo pipefail
          python3 scripts/check-catalog.py --skill-craft-root "$GITHUB_WORKSPACE/skill-craft"
          SKILL_CRAFT_ROOT="$GITHUB_WORKSPACE/skill-craft" bash test/setup-matrix-flags.test.sh
          python3 test/catalog.test.py
          python3 test/pins.test.py
          python3 test/release-payload.test.py
      - name: Verify catalog pins (ref + sha + manifest + skill body + qualified payloads)
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check-pins.py
